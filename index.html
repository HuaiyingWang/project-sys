<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Desk — 接案專案管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要內容</a>

<div class="app">
  <header class="masthead">
    <div class="masthead__brand">
      <h1 class="masthead__title">Project Desk</h1>
      <span class="masthead__sub">接案專案管理</span>
    </div>
    <button class="btn btn--ghost btn--sm" id="btn-contacts" type="button">
      <svg class="btn__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1a4 4 0 00-4-4H8a4 4 0 00-4 4v1"/><circle cx="10" cy="7" r="3.2"/><path d="M17 11h4M19 9v4"/></svg>
      聯絡窗口
    </button>
    <button class="btn btn--ghost btn--sm" id="btn-export" type="button">
      <svg class="btn__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      匯出備份
    </button>
    <button class="btn btn--ghost btn--sm" id="btn-import" type="button">
      <svg class="btn__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/></svg>
      匯入備份
    </button>
    <input type="file" id="file-import" accept="application/json" class="sr-only" tabindex="-1">
    <button class="btn btn--ghost btn--sm" id="btn-md" type="button">
      <svg class="btn__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M7 15V9l2.5 3L12 9v6M16 9v4m0 0l-1.5-1.5M16 13l1.5-1.5"/></svg>
      Markdown
    </button>
  </header>

  <main id="main">

    <!-- ============ 列表頁 ============ -->
    <section id="view-list" aria-labelledby="list-h">
      <h2 id="list-h" class="sr-only">專案列表</h2>

      <div class="toolbar">
        <div class="toolbar__row">
          <div class="search">
            <svg class="search__ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <label class="sr-only" for="q">搜尋專案</label>
            <input class="search__input" id="q" type="search" placeholder="搜尋專案名稱、業務、網域或備註" autocomplete="off">
          </div>
          <label class="sr-only" for="sort">排序方式</label>
          <select class="select" id="sort">
            <option value="updated">最近更新</option>
            <option value="created">建立日期</option>
            <option value="expiry">維護到期日</option>
            <option value="name">名稱</option>
            <option value="client">業務</option>
            <option value="reqs">待辦需求數</option>
          </select>
          <button class="btn btn--primary" id="btn-new" type="button">
            <svg class="btn__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            新增專案
          </button>
        </div>
        <div class="toolbar__row">
          <div class="chips" id="chips" role="group" aria-label="依狀態篩選"></div>
        </div>
        <p class="resultbar" id="resultbar" role="status" aria-live="polite"></p>
      </div>

      <div id="list-sheet"></div>
    </section>

    <!-- ============ 詳細頁 ============ -->
    <section id="view-detail" aria-labelledby="detail-title" hidden></section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ 專案編輯 ============ -->
<dialog id="dlg-project" aria-labelledby="dlg-project-title">
  <form method="dialog" id="form-project">
    <div class="dlg__head">
      <h2 class="dlg__title" id="dlg-project-title">新增專案</h2>
      <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
    </div>
    <div class="dlg__body">
      <fieldset class="fset">
        <legend>基本資料</legend>
        <div class="form-grid">
          <div class="form-grid--full">
            <label class="lbl" for="f-name">專案名稱 <span aria-hidden="true">*</span></label>
            <input class="inp" id="f-name" name="name" required maxlength="120">
          </div>
          <div>
            <label class="lbl" for="f-status">狀態</label>
            <select class="inp" id="f-status" name="status"></select>
          </div>
          <div>
            <label class="lbl" for="f-client">業務</label>
            <input class="inp" id="f-client" name="client" maxlength="80">
          </div>
          <div class="form-grid--full">
            <label class="lbl" for="f-contact">聯絡窗口</label>
            <div class="picker">
              <select class="inp" id="f-contact" name="contactId"></select>
              <button class="btn" type="button" id="btn-add-contact">新增窗口</button>
            </div>
            <p class="hint" id="contact-preview">電話與信箱跟著窗口資料走，改一次全部專案都會更新。</p>
          </div>
        </div>
      </fieldset>

      <fieldset class="fset">
        <legend>技術資訊</legend>
        <div class="form-grid">
          <div>
            <label class="lbl" for="f-domain">正式網域</label>
            <input class="inp" id="f-domain" name="domain" placeholder="example.com.tw">
          </div>
          <div>
            <label class="lbl" for="f-test">測試站網址</label>
            <input class="inp" id="f-test" name="testUrl" placeholder="test.example.com.tw">
          </div>
          <div>
            <label class="lbl" for="f-admin">後台網址</label>
            <input class="inp" id="f-admin" name="adminUrl">
          </div>
          <div>
            <label class="lbl" for="f-host">主機商 / 主機</label>
            <input class="inp" id="f-host" name="host">
          </div>
          <div>
            <label class="lbl" for="f-ftphost">FTP 位址</label>
            <input class="inp" id="f-ftphost" name="ftpHost">
          </div>
          <div>
            <label class="lbl" for="f-ftpuser">FTP 帳號</label>
            <input class="inp" id="f-ftpuser" name="ftpUser">
          </div>
          <div class="form-grid--full">
            <label class="lbl" for="f-ftpnote">密碼存放位置</label>
            <input class="inp" id="f-ftpnote" name="ftpNote" placeholder="例：1Password「中興應用」項目">
            <p class="hint">這裡只記「密碼放在哪」。密碼本體請留在密碼管理工具，不要輸入到這個欄位。</p>
          </div>
        </div>
      </fieldset>

      <fieldset class="fset">
        <legend>日期與備註</legend>
        <div class="form-grid">
          <div>
            <label class="lbl" for="f-launch">上線日期</label>
            <input class="inp" id="f-launch" name="launchDate" type="date">
          </div>
          <div>
            <label class="lbl" for="f-expiry">維護到期日</label>
            <input class="inp" id="f-expiry" name="expiryDate" type="date">
          </div>
          <div class="form-grid--full">
            <label class="lbl" for="f-tags">標籤</label>
            <input class="inp" id="f-tags" name="tags" placeholder="WordPress, RWD, 政府案　以逗號分隔">
          </div>
          <div class="form-grid--full">
            <label class="lbl" for="f-note">備註</label>
            <textarea class="inp ta" id="f-note" name="note"></textarea>
          </div>
        </div>
      </fieldset>
    </div>
    <div class="dlg__foot">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn btn--primary" type="submit" id="btn-save-project">儲存專案</button>
    </div>
  </form>
</dialog>

<!-- ============ 聯絡窗口清單 ============ -->
<dialog id="dlg-contacts" aria-labelledby="dlg-contacts-title">
  <div class="dlg__head">
    <h2 class="dlg__title" id="dlg-contacts-title">聯絡窗口</h2>
    <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
  </div>
  <div class="dlg__body" id="contacts-body"></div>
  <div class="dlg__foot">
    <button class="btn btn--primary" type="button" id="btn-new-contact">新增窗口</button>
  </div>
</dialog>

<!-- ============ 聯絡窗口編輯 ============ -->
<dialog id="dlg-contact" aria-labelledby="dlg-contact-title">
  <form method="dialog" id="form-contact">
    <div class="dlg__head">
      <h2 class="dlg__title" id="dlg-contact-title">新增窗口</h2>
      <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
    </div>
    <div class="dlg__body">
      <div class="form-grid">
        <div>
          <label class="lbl" for="c-name">姓名 <span aria-hidden="true">*</span></label>
          <input class="inp" id="c-name" name="name" required maxlength="60">
        </div>
        <div>
          <label class="lbl" for="c-org">所屬單位</label>
          <input class="inp" id="c-org" name="org" maxlength="80">
        </div>
        <div>
          <label class="lbl" for="c-title">職稱</label>
          <input class="inp" id="c-title" name="title" maxlength="60">
        </div>
        <div>
          <label class="lbl" for="c-phone">電話</label>
          <input class="inp" id="c-phone" name="phone" type="tel" maxlength="40">
        </div>
        <div class="form-grid--full">
          <label class="lbl" for="c-email">信箱</label>
          <input class="inp" id="c-email" name="email" type="email" maxlength="120">
        </div>
        <div class="form-grid--full">
          <label class="lbl" for="c-note">備註</label>
          <textarea class="inp ta" id="c-note" name="note" style="min-height:64px"></textarea>
        </div>
      </div>
    </div>
    <div class="dlg__foot">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn btn--primary" type="submit">儲存窗口</button>
    </div>
  </form>
</dialog>

<!-- ============ Markdown ============ -->
<dialog id="dlg-md" aria-labelledby="dlg-md-title" style="max-width:900px">
  <div class="dlg__head">
    <h2 class="dlg__title" id="dlg-md-title">Markdown 匯出入</h2>
    <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
  </div>
  <div class="dlg__body">
    <p class="hint" style="margin:0 0 12px">
      貼上 Markdown 匯入會<strong>累加</strong>資料，不會清空現有內容。同名的專案與窗口會被更新而非重複建立。
      圖片與檔案無法透過 Markdown 傳遞，完整備份請用 JSON。
    </p>
    <label class="lbl" for="md-text">內容</label>
    <textarea class="inp ta" id="md-text" spellcheck="false"
      style="min-height:340px;font-family:var(--mono);font-size:14px;line-height:1.7"
      placeholder="# 專案&#10;&#10;## 中興應用&#10;- 狀態: 已上線&#10;- 業務: 中興大學&#10;- 窗口: 王雅婷&#10;- 網域: app.nchu.edu.tw&#10;- 到期日: 2026-11-20&#10;&#10;### 需求&#10;- [ ] 2026-08-03 @王雅婷 首頁 banner 要換成新版"></textarea>
    <p class="hint" id="md-status"></p>
  </div>
  <div class="dlg__foot">
    <button class="btn" type="button" id="md-fill">帶入目前資料</button>
    <button class="btn" type="button" id="md-copy">複製</button>
    <button class="btn" type="button" id="md-download">下載 .md</button>
    <button class="btn btn--primary" type="button" id="md-import">匯入上方內容</button>
  </div>
</dialog>

<!-- ============ 確認刪除 ============ -->
<dialog id="dlg-confirm" aria-labelledby="dlg-confirm-title">
  <div class="dlg__head"><h2 class="dlg__title" id="dlg-confirm-title">確認刪除</h2></div>
  <div class="dlg__body"><p id="dlg-confirm-body" style="margin:0"></p></div>
  <div class="dlg__foot">
    <button class="btn" type="button" id="confirm-no">取消</button>
    <button class="btn btn--danger" type="button" id="confirm-yes">刪除</button>
  </div>
</dialog>

<!-- ============ 圖片檢視 ============ -->
<dialog id="dlg-image" class="lightbox" aria-label="圖片檢視">
  <div class="dlg__head">
    <h2 class="dlg__title" id="dlg-image-title">圖片</h2>
    <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
  </div>
  <div class="dlg__body" style="padding:0"><img id="dlg-image-img" alt=""></div>
</dialog>

<!-- ============ 檔案預覽 ============ -->
<dialog id="dlg-file" class="lightbox" aria-label="檔案預覽">
  <div class="dlg__head">
    <h2 class="dlg__title" id="dlg-file-title">檔案</h2>
    <a class="btn btn--ghost btn--sm" id="dlg-file-dl" download>下載</a>
    <button class="btn btn--ghost btn--sm" type="button" data-close aria-label="關閉">✕</button>
  </div>
  <div class="dlg__body" id="dlg-file-body" style="padding:0"></div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
